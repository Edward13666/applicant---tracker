```html
<!DOCTYPE html>
<html>
<head>
<title>Applicant Status Tracker</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    padding:30px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
}

button{
    background:#0066cc;
    color:white;
    border:none;
    padding:12px 20px;
    cursor:pointer;
}

.card{
    margin-top:20px;
    padding:20px;
    background:#f8f9fa;
    border-left:5px solid #0066cc;
}
</style>

</head>
<body>

<div class="container">

<h1>Applicant Status Tracker</h1>

<input type="text" id="caseId" placeholder="Enter Case ID">

<button onclick="searchCase()">Check Status</button>

<div id="result"></div>

</div>

<script>

const applicants = [
{
    caseId: "PRN-USA-2026-68421",
    name: "Sashagay Angella Gordon",
    dob: "2000-06-26",
    nationality: "Jamaican",
    email: "sashagaygordon25@gmail.com",
    phone: "+1 (876) 909-6824",
    destination: "United States of America",
    status: "Approved - Work Permit Card Processing In Progress",
    approvalDate: "2026-06-05",
    expectedCompletion: "September 8, 2026",
    notes: "The 6-month Nurse (PR) Work Permit Application was approved and is currently being processed."
}
];

function searchCase(){

    const caseId =
    document.getElementById("caseId").value.trim();

    const applicant =
    applicants.find(a => a.caseId === caseId);

    if(applicant){

        document.getElementById("result").innerHTML = `
        <div class="card">

        <h2>${applicant.name}</h2>

        <p><strong>Case ID:</strong> ${applicant.caseId}</p>
        <p><strong>Date of Birth:</strong> ${applicant.dob}</p>
        <p><strong>Nationality:</strong> ${applicant.nationality}</p>
        <p><strong>Email:</strong> ${applicant.email}</p>
        <p><strong>Phone:</strong> ${applicant.phone}</p>
        <p><strong>Destination:</strong> ${applicant.destination}</p>
        <p><strong>Status:</strong> ${applicant.status}</p>
        <p><strong>Approval Date:</strong> ${applicant.approvalDate}</p>
        <p><strong>Expected Completion:</strong> ${applicant.expectedCompletion}</p>
        <p><strong>Notes:</strong> ${applicant.notes}</p>

        </div>
        `;
    }
    else{
        document.getElementById("result").innerHTML =
        "<h3>Case ID not found</h3>";
    }
}

</script>

</body>
</html>
```

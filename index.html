<!DOCTYPE html>
<html>
<head>
<title>Applicant Status Tracker</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f6f9;
padding:30px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 0 15px rgba(0,0,0,.1);
}

h1{
color:#003366;
}

input{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:10px;
font-size:16px;
}

button{
background:#0066cc;
color:white;
padding:12px 25px;
border:none;
cursor:pointer;
font-size:16px;
border-radius:5px;
}

.card{
margin-top:25px;
padding:20px;
background:#f8f9fa;
border-left:5px solid #0066cc;
}

.card p{
margin:8px 0;
}
</style>

</head>

<body>

<div class="container">

<h1>Applicant Status Tracker</h1>

<input
type="text"
id="caseId"
placeholder="Enter Case ID">

<button onclick="searchCase()">
Check Status
</button>

<div id="result"></div>

</div>

<script>

async function searchCase(){

const caseId =
document.getElementById("caseId").value.trim();

const response =
await fetch("applicant.json");

const data =
await response.json();

const applicant =
data.find(item => item.caseId === caseId);

if(applicant){

document.getElementById("result").innerHTML =`

<div class="card">

<h2>${applicant.name}</h2>

<p style="display:inline-block;
background:#28a745;
color:white;
padding:8px 15px;
border-radius:20px;
font-weight:bold;">
APPROVED
</p>

<p><strong>Case ID:</strong> ${applicant.caseId}</p>

<p><strong>Date of Birth:</strong> ${applicant.dateOfBirth}</p>

<p><strong>Nationality:</strong> ${applicant.nationality}</p>

<p><strong>Email:</strong> ${applicant.email}</p>

<p><strong>Phone:</strong> ${applicant.phone}</p>

<p><strong>Destination:</strong> ${applicant.destination}</p>

<p><strong>Current Status:</strong> ${applicant.status}</p>
<p><strong>Current Stage:</strong> Work Permit Card Processing</p>

<p><strong>Approval Date:</strong> ${applicant.approvalDate}</p>

<p><strong>Approval Time:</strong> ${applicant.approvalTime}</p>
<p><strong>Application Progress:</strong> 65% Complete</p>

<p><strong>Expected Completion:</strong> ${applicant.expectedCompletion}</p>

<p><strong>Estimated Processing Period:</strong> 2–3 Months</p>
<p><strong>Application Notes:</strong><br>
${applicant.note}</p>

<br><br>

<button onclick="window.print()">
Print Application Status
</button>
</div>

`;

}else{

document.getElementById("result").innerHTML =
"<h3>Case ID not found.</h3>";

}

}

</script>

</body>
</html>
